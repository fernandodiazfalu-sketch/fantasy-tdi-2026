<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --font-sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg-page:#0b1f14;
  --surface-1:#12291b;
  --surface-2:#16321f;
  --border:#234730;
  --border-strong:#2e5c3c;
  --border-stronger:#3c7a4f;
  --border-accent:#4ade80;
  --border-danger:#f87171;
  --text-primary:#f0fdf4;
  --text-secondary:#9cc9ab;
  --text-accent:#4ade80;
  --text-danger:#fca5a5;
  --text-success:#052e16;
  --text-warning:#4a2c02;
  --bg-success:#4ade80;
  --bg-accent:#1e3a8a33;
  --bg-warning:#fbbf24;
  --bg-danger:#7f1d1d55;
  --radius:8px;
  --fill-accent:#16a34a;
  --on-accent:#052e16;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg-page);min-height:100%}
body{font-family:var(--font-sans);color:var(--text-primary)}
.wrap{max-width:860px;margin:0 auto;padding:1rem}
.nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;margin-bottom:1.25rem;border-radius:14px;background:linear-gradient(120deg,#0f5132,#0b1f14);border:0.5px solid var(--border)}
.nav-title{font-size:17px;font-weight:700;color:#fff;letter-spacing:.02em}
.tabs{display:flex;gap:0;margin-bottom:1.25rem;border-bottom:0.5px solid var(--border);overflow-x:auto}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;white-space:nowrap}
.tab.active{color:var(--text-primary);border-bottom-color:var(--text-primary);font-weight:500}
.tab:hover:not(.active){color:var(--text-primary)}
.card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin-bottom:.75rem}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:500}
.bg{background:var(--bg-success);color:var(--text-success)}
.bb{background:var(--bg-accent);color:var(--text-accent)}
.ba{background:var(--bg-warning);color:var(--text-warning)}
.bg2{background:var(--surface-1);color:var(--text-secondary)}
.bt{background:var(--bg-success);color:var(--text-success)}
input,select{font-family:inherit;font-size:14px;padding:8px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);width:100%;margin-bottom:.75rem;outline:none}
input:focus{border-color:var(--border-accent)}
label{font-size:13px;color:var(--text-secondary);display:block;margin-bottom:4px}
button{font-family:inherit;font-size:14px;padding:8px 16px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);cursor:pointer}
button:hover{background:var(--surface-1)}
button.primary{background:var(--text-primary);color:var(--surface-2);border-color:transparent}
button.primary:hover{opacity:.85}
button.danger{border-color:var(--border-danger);color:var(--text-danger)}
button.danger:hover{background:var(--bg-danger)}
button.ghost{border:none;background:none;color:var(--text-secondary);font-size:13px;padding:4px 8px}
button.ghost:hover{color:var(--text-primary);background:var(--surface-1)}
button:disabled{opacity:.5;cursor:not-allowed}
.flex-sb{display:flex;align-items:center;justify-content:space-between}
.st{font-size:16px;font-weight:500;margin-bottom:.75rem;color:var(--text-primary)}
.ht{font-size:12px;color:var(--text-secondary);margin-bottom:.75rem}
.zh{font-size:11px;font-weight:500;color:var(--text-secondary);margin:.75rem 0 4px;text-transform:uppercase;letter-spacing:.04em}
.prow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--border)}
.prow:last-child{border-bottom:none}
.tf{background:linear-gradient(180deg,#1a3d26,#0f2417);border-radius:14px;padding:1.25rem;background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,.03) 39px,rgba(255,255,255,.03) 40px)}
.slot{border:1.5px dashed var(--border-strong);border-radius:10px;padding:8px 12px;margin:4px 0;display:flex;align-items:center;gap:10px;min-height:46px;cursor:pointer;background:rgba(0,0,0,.15)}
.slot.filled{border-style:solid;border-color:var(--border-stronger);background:var(--surface-2);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.slot:hover{background:var(--surface-1);border-color:var(--border-accent)}
.jersey{width:26px;height:26px;border-radius:6px;background:linear-gradient(160deg,var(--fill-accent),#0f5132);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.pl{font-size:10px;font-weight:600;color:var(--text-secondary);min-width:68px;text-transform:uppercase;letter-spacing:.03em}
.field-formation{display:flex;flex-direction:column;gap:10px;padding:1.25rem .5rem}
.formation-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.pos-card{width:150px;min-height:78px;border-radius:12px;border:1.5px dashed var(--border-strong);background:rgba(0,0,0,.18);padding:8px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.pos-card.filled{border-style:solid;border-color:var(--border-stronger);background:var(--surface-2);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.pos-card:hover{background:var(--surface-1);border-color:var(--border-accent)}
.pos-card .jersey{width:28px;height:28px;font-size:12px;margin-bottom:2px}
.pos-card .poslabel{font-size:9px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.03em}
.pos-card .pname{font-size:12px;font-weight:600;line-height:1.25;color:var(--text-primary)}
.pos-card .ppts{font-size:10px;color:var(--text-secondary)}
.sort-tab{font-size:12px;padding:4px 10px;border-radius:20px;cursor:pointer;border:0.5px solid var(--border-strong);background:transparent;color:var(--text-secondary)}
.sort-tab.active{background:var(--border-accent);color:#052e16;border-color:transparent;font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:var(--surface-2);border-radius:12px;border:0.5px solid var(--border-strong);padding:1.5rem;width:92%;max-width:480px;max-height:82vh;overflow-y:auto}
.mopt{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius);cursor:pointer}
.mopt:hover{background:var(--surface-1)}
.mopt.disabled{opacity:.4;cursor:not-allowed}
.rrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--border)}
.rrow:last-child{border-bottom:none}
.ptsl{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:.75rem}
.pp{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--surface-1);color:var(--text-secondary);border:0.5px solid var(--border)}
.pos-tab{font-size:12px;padding:4px 10px;border-radius:20px;cursor:pointer;border:0.5px solid var(--border-strong);background:transparent;color:var(--text-secondary)}
.pos-tab.active{background:var(--text-primary);color:var(--surface-2);border-color:transparent}
.ftab{font-size:12px;padding:4px 12px;border-radius:20px;cursor:pointer;border:0.5px solid var(--border-strong);background:transparent;color:var(--text-secondary)}
.ftab.active{background:var(--fill-accent);color:var(--on-accent);border-color:transparent}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:4px;margin-bottom:.75rem}
.fcell{text-align:center;padding:6px 4px;border-radius:var(--radius);font-size:12px;background:var(--surface-1);border:0.5px solid var(--border)}
.fcell .lbl{font-size:10px;color:var(--text-secondary);margin-bottom:2px}
.login-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:.75rem}
.login-row input{margin-bottom:0}
.msg{font-size:13px;padding:8px 12px;border-radius:var(--radius);margin-bottom:.75rem}
.msg.err{background:var(--bg-danger);color:var(--text-danger)}
.msg.ok{background:var(--bg-success);color:var(--text-success)}
.toggle-link{font-size:13px;color:var(--text-accent);background:none;border:none;cursor:pointer;padding:0;font-family:inherit}
.toggle-link:hover{text-decoration:underline}
.warn{font-size:12px;color:var(--text-warning);background:var(--bg-warning);padding:6px 10px;border-radius:var(--radius);margin-bottom:.5rem}
</style>

function gs(j,f){return(FD[f]?.stats||{})[`${j.nombre}__${j.equipo}`]||{};}
function gb(j,f){return!!(FD[f]?.bonus||{})[j.equipo];}
function cpf(j,isK,f){
  const s=gs(j,f);let p=0;
  if(s.titular)p+=PC.tit;else if(s.suplente)p+=PC.sup;
  p+=(s.tries||0)*PC.try+(s.drops||0)*PC.drop+(s.amarillas||0)*PC.am+(s.rojas||0)*PC.ro;
  if(isK){
    const P=s.penales||0,G=s.conversiones||0,Gf=s.convFalladas||0;
    const raw=P*3+G*2-Gf*2;
    const denom=P+G+Gf;
    const pctK=denom>0?(P+G)/denom:0;
    p+=Math.round(raw*pctK);
  }
  if(gb(j,f))p+=PC.bon;
  return p;
}
function cpt(j,isK){return ALL_FECHAS.reduce((s,f)=>s+cpf(j,isK,f),0);}
function isFechaClosed(f){
  const dl=FECHA_DEADLINES[f]?new Date(FECHA_DEADLINES[f]):null;
  return dl?new Date()>=dl:false;
}
function squadForFecha(eq,f){
  if(eq.historial===undefined){
    return{slots:eq.slots||[],kicker:eq.kicker,capitan:eq.capitan};
  }
  if(eq.historial&&eq.historial[f])return eq.historial[f];
  if(isFechaClosed(f))return{slots:[],kicker:null,capitan:null};
  return{slots:eq.slots||[],kicker:eq.kicker,capitan:eq.capitan};
}
function slotPtsRaw(sq,slot,f){
  const j=JL.find(x=>x.id===slot.jid);if(!j)return 0;
  const base=cpf(j,sq.kicker===slot.jid,f);
  return sq.capitan===slot.jid?base*2:base;
}
function slotPts(eq,slot,f){
  // used by live-editing views (Mis equipos current selection preview)
  const j=JL.find(x=>x.id===slot.jid);if(!j)return 0;
  const base=f?cpf(j,eq.kicker===slot.jid,f):cpt(j,eq.kicker===slot.jid);
  return eq.capitan===slot.jid?base*2:base;
}
function ceqf(eq,f){
  const sq=squadForFecha(eq,f);
  return(sq.slots||[]).reduce((s,slot)=>{
    if(!slot?.jid)return s;
    return s+slotPtsRaw(sq,slot,f);
  },0);
}
function ceq(eq){
  return ALL_FECHAS.reduce((s,f)=>s+ceqf(eq,f),0);
}
const POS_GROUPS=[
  {name:'Pilares',pos:[1,3],color:'#f87171'},
  {name:'Hooker',pos:[2],color:'#fb7185'},
  {name:'2da línea',pos:[4,5],color:'#fb923c'},
  {name:'3ra línea',pos:[6,7,8],color:'#facc15'},
  {name:'Medioscrum',pos:[9],color:'#4ade80'},
  {name:'Apertura',pos:[10],color:'#2dd4bf'},
  {name:'Centros',pos:[12,13],color:'#38bdf8'},
  {name:'Outside backs',pos:[11,14,15],color:'#a78bfa'}
];
function groupPts(eq,f){
  const g={};POS_GROUPS.forEach(pg=>g[pg.name]=0);
  (eq.slots||[]).forEach(slot=>{
    if(!slot?.jid)return;
    const pg=POS_GROUPS.find(x=>x.pos.includes(slot.pos));
    if(!pg)return;
    g[pg.name]+=slotPts(eq,slot,f);
  });
  return g;
}
function buildIdealTeam(f){
  const candidates=JL.filter(j=>{const s=gs(j,f);return s.titular||s.suplente;});
  let kicker=null,kickerVal=0;
  candidates.forEach(j=>{const s=gs(j,f);const val=(s.conversiones||0)*PC.conv+(s.penales||0)*PC.pen;if(val>kickerVal){kickerVal=val;kicker=j;}});
  const slots={};const teamCount={};
  function groupOf(puesto){return POS_GROUPS.find(g=>g.pos.includes(puesto));}
  function tryAssign(j){
    const grp=groupOf(j.puesto);
    if(!grp)return false;
    let targetPos=(j.puesto>=1&&j.puesto<=15&&!slots[j.puesto])?j.puesto:grp.pos.find(p=>!slots[p]);
    if(targetPos===undefined||targetPos===null)return false;
    if((teamCount[j.equipo]||0)>=MAX_POR_EQUIPO)return false;
    slots[targetPos]=j;teamCount[j.equipo]=(teamCount[j.equipo]||0)+1;
    return true;
  }
  if(kicker)tryAssign(kicker);
  const rest1=candidates.filter(j=>j!==kicker).sort((a,b)=>cpf(b,false,f)-cpf(a,false,f));
  let capitan=rest1.length?rest1[0]:null;
  if(capitan)tryAssign(capitan);
  const rest=rest1.filter(j=>j!==capitan);
  // Fill each real position line only with candidates from that same line
  POS_GROUPS.forEach(grp=>{
    rest.filter(j=>grp.pos.includes(j.puesto))
        .forEach(j=>{if(grp.pos.every(p=>slots[p]))return;tryAssign(j);});
  });
  const eqSlots=Object.keys(slots).map(pn=>({pos:parseInt(pn),jid:slots[pn].id}));
  return{nombre:'Equipo ideal',slots:eqSlots,kicker:kicker?kicker.id:null,capitan:capitan?capitan.id:null};
}
function teamCounts(eq,excludePos){
  const c={};
  (eq.slots||[]).forEach(s=>{
    if(!s?.jid)return;
    if(excludePos!==undefined&&s.pos===excludePos)return;
    const j=JL.find(x=>x.id===s.jid);if(!j)return;
    c[j.equipo]=(c[j.equipo]||0)+1;
  });
  return c;
}

async function upsertEq(eq){
  if(eq.id&&String(eq.id).startsWith('tmp_')){
    const aid=String(eq.id).replace('tmp_','');
    const am=S.amigos.find(a=>a.id===aid);
    if(am){am.equipo={slots:eq.slots,kicker:eq.kicker,capitan:eq.capitan};S.equipos=S.equipos.filter(e=>e.id!==eq.id);await upsertAm(am);}
    return eq;
  }
  if(eq.id){
    const{data,error}=await sb.from('equipos').update({nombre:eq.nombre,slots:eq.slots,kicker:eq.kicker,capitan:eq.capitan||null,apodo:eq.apodo||null,historial:eq.historial||{}}).eq('id',eq.id).select().single();
    if(error)throw error;
    if(data){
      const i=S.equipos.findIndex(e=>e.id===eq.id);if(i>=0)S.equipos[i]=data;
      const j=(S.allEquipos||[]).findIndex(e=>e.id===eq.id);if(j>=0)S.allEquipos[j]=data;
    }
    return data||eq;
  }
  const{data,error}=await sb.from('equipos').insert({nombre:eq.nombre,slots:eq.slots||[],kicker:eq.kicker||null,capitan:eq.capitan||null,user_id:S.session.user.id,email:S.session.user.email}).select().single();

}

async function doAuth(){
  if(S.authLoading)return;
  S.authLoading=true;S.authMsg=null;r();
  const email=S.authEmail.trim(),pass=S.authPass;
  if(!email||!pass){S.authMsg={type:'err',text:'Completá email y contraseña.'};S.authLoading=false;r();return;}
  const res=S.authMode==='login'
    ?await sb.auth.signInWithPassword({email,password:pass})
    :await sb.auth.signUp({email,password:pass});
  if(res.error){
    const m={'Invalid login credentials':'Email o contraseña incorrectos.','User already registered':'Ya existe una cuenta con ese email.'};
    S.authMsg={type:'err',text:m[res.error.message]||res.error.message};
    S.authLoading=false;r();return;
  }
  if(S.authMode==='register'&&!res.data.session){
    S.authMsg={type:'ok',text:'¡Cuenta creada! Revisá tu email para confirmar y luego ingresá.'};
    S.authLoading=false;S.authMode='login';r();return;
  }
  S.session=res.data.session;await loadData();S.authLoading=false;r();
}

function mainTeam(list){
  if(!list||!list.length)return null;
  return list.reduce((best,e)=>{
    const filled=(e.slots||[]).filter(s=>s?.jid).length;
    const bestFilled=(best.slots||[]).filter(s=>s?.jid).length;
    return filled>bestFilled?e:best;
  },list[0]);
}
function groupByUser(list){
  const byUser={};
  (list||[]).forEach(e=>{
    if(!byUser[e.user_id])byUser[e.user_id]=[];
    byUser[e.user_id].push(e);
  });
  return Object.values(byUser).map(eqs=>({team:mainTeam(eqs),email:eqs[0].email||null,uid:eqs[0].user_id}));
}
function rMisEq(div){

function avgPtsG(j){
  const played=ALL_FECHAS.filter(f=>{const s=gs(j,f);return s.titular||s.suplente}).length;
  return played?(cpt(j,false)/played):0;
}
function kickingPtsG(j){return cpt(j,true)-cpt(j,false);}
function formPtsG(j){
  const played=ALL_FECHAS.filter(f=>{const s=gs(j,f);return s.titular||s.suplente});
  return played.slice(-3).reduce((s,f)=>s+cpf(j,false,f),0);
}
function popularityG(j){
  const users=groupByUser(S.allEquipos).filter(u=>u.team);
  if(!users.length)return 0;
  const count=users.filter(u=>(u.team.slots||[]).some(s=>s?.jid===j.id)).length;
  return Math.round(100*count/users.length);
}
function groupForPuesto(p){
  const g=POS_GROUPS.find(x=>x.pos.includes(p));
  return g?g.name:'Otros';
}

    const b=document.createElement('button');b.className='ftab'+((S.rendSub||'tuequipo')===v?' active':'');
    b.textContent=l;b.onclick=()=>{S.rendSub=v;r()};subtabs.appendChild(b);
  });
  div.appendChild(subtabs);

  const sub=S.rendSub||'tuequipo';
  const content=document.createElement('div');

  if(sub==='tuequipo'){
    if(myTeam){
      const card=document.createElement('div');card.className='card';
      const mySq=squadForFecha(myTeam,f);
      renderSquadAsList(card,mySq,f);
      content.appendChild(card);
    } else {
      content.innerHTML='<div class="card"><p style="font-size:14px;color:var(--text-secondary);text-align:center;padding:1rem">Todavía no armaste tu equipo.</p></div>';
    }
  } else if(sub==='top20'){
    const sorted=[...JL].map(j=>({j,pts:cpf(j,false,f)})).filter(x=>x.pts>0).sort((a,b)=>b.pts-a.pts).slice(0,20);
    const card=document.createElement('div');card.className='card';
    sorted.forEach(({j,pts},i)=>{
      const row=document.createElement('div');row.className='prow';row.style.cursor='pointer';
      row.innerHTML=`<span style="font-size:11px;color:var(--text-secondary);min-width:20px">${i+1}.</span>
        <span style="flex:1;font-size:13px;font-weight:500">${j.nombre} <span style="font-size:11px;color:var(--text-secondary)">${j.equipo}</span></span>
        <span class="badge bb">${pts} pts</span>`;
      row.onclick=()=>{S.modal={type:'playerinfo',jid:j.id};r()};
      card.appendChild(row);
    });
    content.appendChild(card);
  } else if(sub==='fecha'){
    const p=document.createElement('p');p.className='ht';p.textContent='La mejor combinación posible esta fecha: mejor pateador, capitán por PV, y el resto por PV respetando el límite de 2 por equipo real.';
    content.appendChild(p);
    const card=document.createElement('div');card.className='card';
    renderSquadAsList(card,{slots:ideal.slots,kicker:ideal.kicker,capitan:ideal.capitan},f);
    content.appendChild(card);
    if(best){
      const h=document.createElement('div');h.className='st';h.style.marginTop='1.25rem';h.textContent='Mejor equipo real de la fecha';content.appendChild(h);
      const bc=document.createElement('div');bc.className='card';
      const isMe=best.uid===S.session.user.id;
      bc.innerHTML=`<div class="flex-sb"><div><div style="font-size:14px;font-weight:500">${isMe?'Vos · ':''}${best.team.apodo||best.email||'Jugador'}</div><div style="font-size:11px;color:var(--text-secondary)">${best.team.nombre}</div></div><span class="badge bg" style="font-size:15px;padding:4px 12px">${bestPts} pts</span></div>`;
      const vb=document.createElement('button');vb.textContent='Ver equipo';vb.style.marginTop='.5rem';
      vb.onclick=()=>{S.modal={type:'teamview',squad:squadForFecha(best.team,f),fecha:f,label:(best.team.apodo||best.email||'Jugador')};r()};
      bc.appendChild(vb);
      content.appendChild(bc);
    }
  } else if(sub==='pop'){
    const sorted=[...JL].map(j=>({j,pop:popularityG(j),pts:cpf(j,false,f)})).filter(x=>x.pop>0).sort((a,b)=>b.pop-a.pop).slice(0,20);
    const card=document.createElement('div');card.className='card';
    if(!sorted.length){card.innerHTML='<p style="font-size:13px;color:var(--text-secondary);text-align:center;padding:1rem">Todavía no hay equipos suficientes para calcular popularidad.</p>';}
    sorted.forEach(({j,pop,pts},i)=>{
      const row=document.createElement('div');row.className='prow';row.style.cursor='pointer';
      row.innerHTML=`<span style="font-size:11px;color:var(--text-secondary);min-width:20px">${i+1}.</span>
        <span style="flex:1;font-size:13px;font-weight:500">${j.nombre} <span style="font-size:11px;color:var(--text-secondary)">${j.equipo}</span></span>
        <span class="badge bt" style="margin-right:4px">${pop}%</span>
        <span class="badge bb">${pts} pts</span>`;
      row.onclick=()=>{S.modal={type:'playerinfo',jid:j.id};r()};
      card.appendChild(row);
    });
    content.appendChild(card);
  }
  div.appendChild(content);

  // Gráfico de puestos (debajo de todo)
  const h4=document.createElement('div');h4.className='st';h4.style.marginTop='1.5rem';h4.textContent='Puestos más performantes';div.appendChild(h4);
  const legend=document.createElement('div');legend.style.cssText='display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1rem';
  POS_GROUPS.forEach(pg=>{
    const s=document.createElement('span');s.style.cssText=`font-size:11px;padding:3px 10px;border-radius:20px;background:${pg.color}22;color:${pg.color};border:1px solid ${pg.color}55`;
    s.textContent=pg.name;legend.appendChild(s);
  });
  div.appendChild(legend);
  const participants=[
    ...(myTeam?[{label:'Yo',eq:squadForFecha(myTeam,f)}]:[]),
    ...S.amigos.map(a=>({label:a.nombre,eq:{slots:a.equipo?.slots||[],kicker:a.equipo?.kicker||null,capitan:a.equipo?.capitan||null}})),
    {label:'Ideal',eq:ideal}
  ];
  const maxTotal=Math.max(1,...participants.map(p=>ceqf(p.eq,f)));
  const chart=document.createElement('div');chart.className='card';
  chart.style.cssText+=';display:flex;align-items:flex-end;gap:18px;height:240px;padding:1.5rem 1rem 1rem;overflow-x:auto';
  participants.forEach(p=>{
    const g=groupPts(p.eq,f);
    const total=ceqf(p.eq,f);
    const barWrap=document.createElement('div');barWrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:8px;min-width:64px;flex-shrink:0';
    const bar=document.createElement('div');bar.style.cssText=`width:40px;height:${Math.max(4,(total/maxTotal)*180)}px;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;border:0.5px solid var(--border)`;
    POS_GROUPS.forEach(pg=>{
      const val=g[pg.name]||0;
      if(val<=0)return;
      const seg=document.createElement('div');
      seg.style.cssText=`background:${pg.color};height:${total>0?(val/total)*100:0}%;width:100%`;
      seg.title=`${pg.name}: ${val} pts`;
      bar.appendChild(seg);
    });
    barWrap.appendChild(bar);
    const lbl=document.createElement('div');lbl.style.cssText='font-size:11px;text-align:center;color:var(--text-secondary);line-height:1.3';
    lbl.innerHTML=`${p.label}<br><b style="color:var(--text-primary);font-size:13px">${total}</b>`;
    barWrap.appendChild(lbl);
    chart.appendChild(barWrap);
  });
  div.appendChild(chart);
}

function rAlineaciones(div){
  div.innerHTML='<div class="st">Alineaciones</div><p class="ht">Los enfrentamientos de cada fecha, con la alineación confirmada y los puntos de cada jugador.</p>';
  const ftabs=document.createElement('div');ftabs.style.cssText='display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap;overflow-x:auto';
  ALL_FECHAS.forEach(f=>{
    const b=document.createElement('button');b.className='ftab'+((S.alinFecha||getRoundStatus().fecha)===f?' active':'');
    b.textContent=`F${f} · ${FDATES[f]}`;b.onclick=()=>{S.alinFecha=f;r()};ftabs.appendChild(b);
  });
  div.appendChild(ftabs);

  const f=S.alinFecha||getRoundStatus().fecha;
  const partidos=FIXTURE[String(f)]||[];
  if(!partidos.length){
    const empty=document.createElement('div');empty.className='card';
    empty.innerHTML=`<p style="font-size:14px;color:var(--text-secondary);text-align:center;padding:1rem">Todavía no hay fixture confirmado para la Fecha ${f}.</p>`;
    div.appendChild(empty);
    return;
  }

  function renderTeamCol(equipo,f){
    const wrap=document.createElement('div');wrap.style.cssText='flex:1;min-width:220px';
    const titulares=JL.filter(j=>j.equipo===equipo&&gs(j,f).titular).sort((a,b)=>a.puesto-b.puesto);
    const suplentes=JL.filter(j=>j.equipo===equipo&&gs(j,f).suplente).sort((a,b)=>a.puesto-b.puesto);
    const h=document.createElement('div');h.style.cssText='font-size:13px;font-weight:600;margin-bottom:6px';h.textContent=equipo;
    wrap.appendChild(h);
    if(!titulares.length&&!suplentes.length){
      const p=document.createElement('p');p.style.cssText='font-size:12px;color:var(--text-secondary)';p.textContent='Sin alineación confirmada.';
      wrap.appendChild(p);
      return wrap;
    }
    [['Forwards',titulares.filter(j=>j.puesto<=8)],['Backs',titulares.filter(j=>j.puesto>8)],['Bench',suplentes]].forEach(([label,arr])=>{
      if(!arr.length)return;
      const lbl=document.createElement('div');lbl.className='zh';lbl.style.margin='.5rem 0 2px';lbl.textContent=label;
      wrap.appendChild(lbl);
      arr.forEach(j=>{
        const pts=cpf(j,false,f),ptsK=cpf(j,true,f);
        const row=document.createElement('div');row.className='prow';row.style.cursor='pointer';row.style.padding='4px 0';
        row.innerHTML=`<span style="font-size:10px;color:var(--text-secondary);min-width:20px">${j.puesto||'?'}</span>
          <span style="flex:1;font-size:12px;font-weight:500">${j.nombre}</span>
          <span class="badge bb" style="font-size:10px;margin-right:3px">${pts}</span>${ptsK!==pts?`<span class="badge ba" style="font-size:10px">${ptsK}k</span>`:''}`;
        row.onclick=()=>{S.modal={type:'playerinfo',jid:j.id};r()};
        wrap.appendChild(row);
      });
    });
    return wrap;
  }

  partidos.forEach(([local,visita])=>{
    const card=document.createElement('div');card.className='card';
    const row=document.createElement('div');row.style.cssText='display:flex;gap:1.5rem;flex-wrap:wrap';
    row.appendChild(renderTeamCol(local,f));
    row.appendChild(renderTeamCol(visita,f));
    card.appendChild(row);
    div.appendChild(card);
  });
}

function rIdeal(div){
  div.innerHTML='<div class="st">Equipo ideal de la fecha</div><p class="ht">El mejor pateador de la fecha, el jugador de mayor PV como capitán, y el resto completado por PV respetando el límite de 2 por equipo real.</p>';
  const ftabs=document.createElement('div');ftabs.style.cssText='display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap';
  ALL_FECHAS.forEach(f=>{
    const b=document.createElement('button');b.className='ftab'+(S.idealFecha===f?' active':'');
    b.textContent=`F${f} · ${FDATES[f]}`;b.onclick=()=>{S.idealFecha=f;r()};ftabs.appendChild(b);
  });
  div.appendChild(ftabs);
  const f=S.idealFecha||6;
  const ideal=buildIdealTeam(f);
  const idealPts=ceqf(ideal,f);
  const myTeam=mainTeam(S.equipos);
  const myPts=myTeam?ceqf(myTeam,f):0;
  const cmp=document.createElement('div');cmp.className='card';cmp.style.marginBottom='.75rem';
  cmp.innerHTML=`<div class="flex-sb"><div><div style="font-size:12px;color:var(--text-secondary)">Tu equipo esta fecha</div><div class="badge bb" style="font-size:16px;padding:4px 12px;margin-top:4px">${myPts} pts</div></div>
    <div style="font-size:18px;color:var(--text-secondary)">vs</div>
    <div style="text-align:right"><div style="font-size:12px;color:var(--text-secondary)">Equipo ideal</div><div class="badge bg" style="font-size:16px;padding:4px 12px;margin-top:4px">${idealPts} pts</div></div></div>`;
  div.appendChild(cmp);
  const tf=document.createElement('div');tf.className='tf field-formation';
  const FORMATION_ROWS=[[1,2,3],[4,5],[6,8,7],[9,10],[12,13],[11,15,14]];
  FORMATION_ROWS.forEach(row=>{
    const rowEl=document.createElement('div');rowEl.className='formation-row';
    row.forEach(pn=>{
      const slot=(ideal.slots||[]).find(s=>s.pos===pn);
      const j=slot?JL.find(x=>x.id===slot.jid):null;
      const isK=!!j&&ideal.kicker===j.id;
      const isC=!!j&&ideal.capitan===j.id;
      const card=document.createElement('div');card.className='pos-card'+(j?' filled':'');
      card.innerHTML=j?
        `${jerseyBadge(j.equipo,pn)}<span class="poslabel">${PN[pn]}</span>
         <span class="pname">${j.nombre.split(',')[0]}${isK?' 🥾':''}${isC?' <span class="badge ba" style="font-size:8px">C</span>':''}</span>
         <span class="ppts">${j.equipo}</span>
         <span class="badge bg" style="margin-top:2px">${slotPts(ideal,slot,f)} pts</span>`
        :`<span class="jersey" style="background:linear-gradient(160deg,#2e5c3c,#16321f)">${pn}</span><span class="poslabel">${PN[pn]}</span><span class="pname" style="color:var(--text-secondary);font-weight:400">—</span>`;
      if(j){card.style.cursor='pointer';card.onclick=()=>{S.modal={type:'playerinfo',jid:j.id};r()};}
      rowEl.appendChild(card);
    });
    tf.appendChild(rowEl);
  });
  div.appendChild(tf);
}

function rTop(div){
  if(S.session){div.innerHTML='<div class="st">Top jugadores</div>';}
  const ftabs=document.createElement('div');ftabs.style.cssText='display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap';
  [['acum','Acumulado'],...ALL_FECHAS.map(f=>[String(f),`F${f} · ${FDATES[f]}`])].forEach(([v,l])=>{
    const b=document.createElement('button');b.className='ftab'+(S.topFecha===v?' active':'');
    b.textContent=l;b.onclick=()=>{S.topFecha=v;r()};ftabs.appendChild(b);
  });
  div.appendChild(ftabs);
  if(S.topFecha!=='acum'){
    const fnum=parseInt(S.topFecha);

    if(!hasStats){
      const w=document.createElement('div');w.className='warn';
      w.textContent=`La Fecha ${fnum} todavía no tiene estadísticas cargadas.`;
      div.appendChild(w);

  const bar=document.createElement('div');bar.className='ptsl';
  [['Titular','3'],['Suplente','1'],['Try','5'],['Drop','4'],['Bonus','2'],['Conv. kicker','2'],['Penal kicker','3'],['Conv. fallada (kicker)','−2'],['Amarilla','−5'],['Roja','−10']].forEach(([k,v])=>{
    const p=document.createElement('span');p.className='pp';p.textContent=`${k}: ${v} pts`;bar.appendChild(p);
  });
  div.appendChild(bar);

  const sorted=[...JL].map(j=>({j,pts:gp(j,false),ptsK:gp(j,true)})).filter(x=>x.ptsK>0).sort((a,b)=>b.ptsK-a.ptsK).slice(0,40);

}
